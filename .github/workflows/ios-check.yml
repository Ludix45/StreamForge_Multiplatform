name: iOS Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Konan (Kotlin/Native)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shared XCFramework
        run: ./gradlew :shared:assembleSharedReleaseXCFramework -Dorg.gradle.workers.max=1 -Dkotlin.native.jvmArgs="-Xmx6g" --stacktrace
        
      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: Shared-XCFramework
          path: shared/build/XCFrameworks/release
