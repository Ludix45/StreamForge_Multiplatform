name: iOS Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shared Framework for iOS
        run: ./gradlew :shared:assembleSharedReleaseFramework
        
      - name: Compile Kotlin iOS Simulator
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64

      - name: Upload Shared Framework
        uses: actions/upload-artifact@v4
        with:
          name: Shared-iOS-Framework
          path: shared/build/cocoapods/framework/Shared.framework
          if-no-files-found: ignore
