name: Update README Release Links
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get Latest Assets
        id: assets
        run: |
          # Recupera i link degli asset dalla release più recente (inclusi i pre-release se necessario)
          # Usiamo l'endpoint /releases invece di /releases/latest per maggiore flessibilità
          RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases)
          
          # Prendiamo la prima release dell'elenco (la più recente)
          MSI_URL=$(echo "$RELEASE_JSON" | jq -r '.[0].assets[] | select(.name | endswith(".msi")) | .browser_download_url' | head -n 1)
          APK_URL=$(echo "$RELEASE_JSON" | jq -r '.[0].assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          
          # Controllo di sicurezza: se non trova nulla, non procedere con l'errore nel sed
          if [ "$MSI_URL" == "null" ] || [ -z "$MSI_URL" ]; then MSI_URL="#"; fi
          if [ "$APK_URL" == "null" ] || [ -z "$APK_URL" ]; then APK_URL="#"; fi
          
          echo "MSI_URL=$MSI_URL" >> $GITHUB_OUTPUT
          echo "APK_URL=$APK_URL" >> $GITHUB_OUTPUT

      - name: Update README.md
        run: |
          # Sostituisce i link nel README
          sed -i '/START_RELEASE_MSI/,/END_RELEASE_MSI/ s|\]([^)]*)$|](${{ steps.assets.outputs.MSI_URL }})|' README.md
          sed -i '/START_RELEASE_APK/,/END_RELEASE_APK/ s|\]([^)]*)$|](${{ steps.assets.outputs.APK_URL }})|' README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "Nessuna modifica necessaria."
          else
            git add README.md
            git commit -m "docs: update latest release links in README"
            git push
          fi
